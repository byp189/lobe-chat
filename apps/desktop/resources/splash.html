<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABEI 专用</title>
    <style>
      body {
        -webkit-app-region: drag;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #1f1f1f;
        overflow: hidden;
      }

      /* 添加暗色模式支持 */
      @media (prefers-color-scheme: dark) {
        body {
          color: #f5f5f5;
        }
      }

      .container {
        text-align: center;
      }

      /* --- ABEI Branding Styles --- */
      .abei-brand-loading {
        font-size: 32px; /* 调整字体大小以匹配原图标尺寸 */
        font-weight: 700;
        letter-spacing: 2px;
        opacity: 0; /* 初始状态为隐藏 */
        color: currentColor;
        
        /* 应用一个简单的淡入/闪烁动画 */
        animation: fadein 2.5s ease-in-out infinite;
      }

      @keyframes fadein {
        0% {
          opacity: 0;
          transform: translateY(10px);
        }
        30% {
          opacity: 1;
          transform: translateY(0);
        }
        70% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      /* 移除原有的 lobe-brand-loading 样式，因为它依赖于 SVG path */
      .lobe-brand-loading,
      .lobe-brand-loading path {
        /* 清除原有 SVG 样式，确保不干扰 */
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 替换为简单的 ABEI 文本元素 -->
      <h1 class="abei-brand-loading">ABEI</h1>
    </div>
  </body>
</html>
